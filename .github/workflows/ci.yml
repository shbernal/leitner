name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--prod` because the published tarball is `dist` and nothing else, so an
      # advisory against a dev-only package should not block a pull request.
      - name: Audit dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm run lint

      # `format:check`, not `format`. In this repo `pnpm format` *writes* — the
      # naming is inverted relative to flashcard-md-spec, where `format` is the
      # read-only one. Using it here would rewrite files and pass regardless.
      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Here rather than among the local checks: an unused export is worth catching
      # before a merge, not worth a sixth step before every commit.
      - name: Find unused exports and dependencies
        run: pnpm run knip

      # Runs after the build on purpose: `files` ships `dist`, `--ignore-scripts`
      # skips the `prepublishOnly` that would otherwise produce it, and packing an
      # empty `dist` would report a passing check on a broken tarball.
      - name: Check the package contents
        run: npm pack --dry-run --ignore-scripts

  commit-check:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages against .github/cchk.toml
        uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false
